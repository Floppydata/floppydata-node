name: Sync API spec

# Regenerates the SDK when the production Client API spec changes and opens a
# PR. Triggered by the client-api production deploy (repository_dispatch with
# the deployed spec's hash), daily as a fallback, or by hand.
on:
  repository_dispatch:
    types: [api-spec-updated]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-spec
  cancel-in-progress: false

env:
  OASDIFF_IMAGE: tufin/oasdiff:v1.33.0

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download the production spec
        id: spec
        env:
          # Passed through env, never interpolated into the script.
          EXPECTED_SHA256: ${{ github.event.client_payload.spec_sha256 }}
        run: |
          cp openapi/v2.json "$RUNNER_TEMP/previous.json"
          node scripts/sync-spec.mjs "$EXPECTED_SHA256"

      - name: Describe the API changes
        if: steps.spec.outputs.changed == 'true'
        id: diff
        run: |
          mkdir -p "$RUNNER_TEMP/specs" && cp "$RUNNER_TEMP/previous.json" "$RUNNER_TEMP/specs/old.json" && cp openapi/v2.json "$RUNNER_TEMP/specs/new.json"
          run_oasdiff() { docker run --rm -v "$RUNNER_TEMP/specs:/specs" "$OASDIFF_IMAGE" "$@"; }
          run_oasdiff changelog /specs/old.json /specs/new.json --format markdown | head -c 60000 > "$RUNNER_TEMP/changelog.md"
          if run_oasdiff breaking /specs/old.json /specs/new.json --fail-on ERR > /dev/null; then
            echo "type=feat" >> "$GITHUB_OUTPUT"
          else
            echo "type=feat!" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate and check
        if: steps.spec.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm generate
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Write the PR description
        if: steps.spec.outputs.changed == 'true'
        run: |
          {
            echo "Regenerated from the production Client API spec (\`/v2/openapi.json\`)."
            echo
            echo "Change type: \`${{ steps.diff.outputs.type }}\` (from \`oasdiff breaking\`). Breaking changes become a new minor version while the SDK is 0.x."
            echo
            echo "Generated by the [Sync API spec workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), which already ran typecheck, lint, tests and build. Check the examples still read well, then merge; release-please will open the release PR."
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the PR
        if: steps.spec.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/api-spec
          delete-branch: true
          commit-message: "${{ steps.diff.outputs.type }}: sync with the Client API spec"
          title: "${{ steps.diff.outputs.type }}: sync with the Client API spec"
          body-path: ${{ runner.temp }}/pr-body.md
